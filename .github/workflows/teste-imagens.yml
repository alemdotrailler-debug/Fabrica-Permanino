name: teste-imagens
on:
  push:
    branches: [teste-imagens]
permissions:
  contents: write
jobs:
  local2:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install diffusers transformers accelerate peft
      - run: python3 teste/local2.py
        continue-on-error: true
      - name: salvar
        run: |
          git config user.name bot; git config user.email bot@x
          git add teste; git commit -m "teste local2" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin teste-imagens && git push origin HEAD:teste-imagens && break; sleep 5; done
