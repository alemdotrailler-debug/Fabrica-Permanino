name: Gerar vídeo

on:
  push:
    branches: [main]
    paths:
      - "videos/*/roteiro.py"
      - "pedidos.txt"
  workflow_dispatch:
    inputs:
      video:
        description: "Pasta do vídeo em videos/ (ex.: david). Para só os Shorts: david:shorts"
        required: true

permissions:
  contents: write

concurrency:
  group: gerar-video
  cancel-in-progress: false

jobs:
  descobrir:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.quais.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Descobrir quais vídeos gerar
        id: quais
        run: |
          if [ -n "${{ github.event.inputs.video }}" ]; then
            L="${{ github.event.inputs.video }}"
          else
            L=$(git diff --name-only HEAD~1 HEAD -- 'videos/*/roteiro.py' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if git diff --name-only HEAD~1 HEAD | grep -qx pedidos.txt; then
              L="$L $(grep -v '^#' pedidos.txt | tr '\n' ' ')"
            fi
          fi
          # lista em JSON para a matriz: cada pedido roda em um computador próprio, ao mesmo tempo
          J=$(echo $L | tr ' ' '\n' | grep -v '^$' | sort -u | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          echo "lista=$J" >> "$GITHUB_OUTPUT"
          echo "pedidos: $J"

  gerar:
    needs: descobrir
    if: ${{ needs.descobrir.outputs.lista != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.descobrir.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar programas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig
          mkdir -p ~/.local/share/fonts && cp fonts/* ~/.local/share/fonts/ && fc-cache -f
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cache das narrações já feitas
        uses: actions/cache@v4
        with:
          path: trabalho/*/wav
          key: narracao-${{ hashFiles('videos/**') }}-${{ matrix.item }}
          restore-keys: narracao-

      - name: Cache dos modelos de voz
        uses: actions/cache@v4
        with:
          path: modelos
          key: kokoro-v1.0

      - name: Gerar
        run: |
          nproc
          item="${{ matrix.item }}"
          v="${item%%:*}"
          echo "=== $item ==="
          if [ "$item" != "$v" ] && [ "${item#*:}" = "shorts" ]; then
            python -m fabrica.shorts "videos/$v"
          else
            python -m fabrica.pipeline "videos/$v"
          fi

      - name: Link público do vídeo (Release do GitHub)
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          item="${{ matrix.item }}"; v="${item%%:*}"
          tag="video-$v-${{ github.run_number }}-${{ strategy.job-index }}"
          if [ "$item" != "$v" ]; then
            ls trabalho/$v/short_*/*_short_*.mp4 | while read f; do
              n=$(basename "$f" .mp4)
              gh release create "$tag-$n" "$f" --title "$n" --notes "Short gerado pela fábrica."
              url="https://github.com/${{ github.repository }}/releases/download/$tag-$n/$n.mp4"
              echo "link: $url"
              sid="${n##*_}"
              python -c "import json,sys; f='saida/$v/short_$sid.json'; d=json.load(open(f)); d['video_url']=sys.argv[1]; json.dump(d,open(f,'w'),indent=1,ensure_ascii=False)" "$url"
            done
          else
            gh release create "$tag" "trabalho/$v/$v.mp4" --title "Vídeo: $v" --notes "Gerado pela fábrica."
            url="https://github.com/${{ github.repository }}/releases/download/$tag/$v.mp4"
            python -c "import json,sys; f='saida/$v/info.json'; d=json.load(open(f)); d['video_url']=sys.argv[1]; json.dump(d,open(f,'w'),indent=1,ensure_ascii=False)" "$url"
            echo "link: $url"
          fi

      - name: Salvar link e thumbnails no repositório
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add saida
          git commit -m "Vídeo pronto: ${{ matrix.item }}" || { echo "nada novo"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            sleep $((RANDOM % 10 + 3))
          done
