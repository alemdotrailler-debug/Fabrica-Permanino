name: Gerar vídeo

on:
  push:
    branches: [main]
    paths:
      - "videos/*/roteiro.py"
      - "pedidos.txt"
  workflow_dispatch:
    inputs:
      video:
        description: "Pasta do vídeo em videos/ (ex.: david). Para só os Shorts: david:shorts"
        required: true

permissions:
  contents: write

concurrency:
  group: gerar-video
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Descobrir quais vídeos gerar
        id: quais
        run: |
          if [ -n "${{ github.event.inputs.video }}" ]; then
            echo "lista=${{ github.event.inputs.video }}" >> "$GITHUB_OUTPUT"
          else
            L=$(git diff --name-only HEAD~1 HEAD -- 'videos/*/roteiro.py' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if git diff --name-only HEAD~1 HEAD | grep -qx pedidos.txt; then
              L="$L $(grep -v '^#' pedidos.txt | tr '\n' ' ')"
            fi
            echo "lista=$(echo $L | tr ' ' '\n' | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar programas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig
          mkdir -p ~/.local/share/fonts && cp fonts/* ~/.local/share/fonts/ && fc-cache -f
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cache das narrações já feitas
        uses: actions/cache@v4
        with:
          path: trabalho/*/wav
          key: narracao-${{ hashFiles('videos/**') }}
          restore-keys: narracao-

      - name: Cache dos modelos de voz
        uses: actions/cache@v4
        with:
          path: modelos
          key: kokoro-v1.0

      - name: Gerar
        run: |
          for item in ${{ steps.quais.outputs.lista }}; do
            v="${item%%:*}"
            echo "=== $item ==="
            if [ "$item" != "$v" ] && [ "${item#*:}" = "shorts" ]; then
              python -m fabrica.shorts "videos/$v"
            else
              python -m fabrica.pipeline "videos/$v"
            fi
          done

      - name: Link público do vídeo (Release do GitHub)
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in ${{ steps.quais.outputs.lista }}; do
            [ -f "trabalho/$v/$v.mp4" ] || continue
            tag="video-$v-${{ github.run_number }}"
            gh release create "$tag" "trabalho/$v/$v.mp4" --title "Vídeo: $v" --notes "Gerado pela fábrica. Link direto do MP4 em saida/$v/info.json."
            url="https://github.com/${{ github.repository }}/releases/download/$tag/$v.mp4"
            python -c "import json,sys; f='saida/$v/info.json'; d=json.load(open(f)); d['video_url']=sys.argv[1]; json.dump(d,open(f,'w'),indent=1,ensure_ascii=False)" "$url"
            echo "link: $url"
          done

      - name: Guardar vídeo (backup de 14 dias)
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            trabalho/*/*.mp4
            trabalho/*/short_*/*.mp4
          retention-days: 14

      - name: Salvar link e thumbnails no repositório
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add saida
          git commit -m "Vídeo pronto: ${{ steps.quais.outputs.lista }}" || echo "nada novo"
          git pull --rebase -X theirs origin main
          git push
